<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드래그 사전 & 번역기</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">Aa</div>
        <div>
          <h1>드래그 사전</h1>
          <p>선택하면 바로 뜻을 확인해요</p>
        </div>
      </header>

      <section class="panel">
        <label class="toggle-row">
          <span>
            <strong>확장 프로그램 사용</strong>
            <small>모든 웹페이지에서 동작</small>
          </span>
          <input id="enabled" type="checkbox">
          <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="toggle-row secondary">
          <span>
            <strong>선택 즉시 검색</strong>
            <small>마우스를 놓으면 결과 표시</small>
          </span>
          <input id="autoLookup" type="checkbox">
          <span class="toggle" aria-hidden="true"></span>
        </label>
      </section>

      <label class="select-label" for="targetLanguage">번역할 언어</label>
      <div class="select-wrap">
        <select id="targetLanguage">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="tip">
        <span class="tip-icon">↗</span>
        <p><b>단어 하나</b>는 사전과 번역을 함께, <b>문장</b>은 자연스러운 번역으로 보여줍니다.</p>
      </div>

      <footer>
        <span id="status" role="status">설정이 자동으로 저장됩니다</span>
        <span class="free">FREE API</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
